<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Online Shopping</title>
</head>

<body>

    <h1>Online Shopping System</h1>

    <form action="order.jsp" method="post">

        Customer Name:
        <input type="text" name="customer" required>

        <br><br>

        Product:
        <select name="product">
            <option>Laptop</option>
            <option>Mobile</option>
            <option>Headphone</option>
        </select>

        <br><br>

        Quantity:
        <input type="number"
               name="quantity"
               min="1"
               required>

        <br><br>

        Price:
        <input type="number"
               name="price"
               required>

        <br><br>

        <input type="submit"
               value="Place Order">

        <input type="reset"
               value="Clear">

    </form>

</body>
</html>
