<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>User Registration Form</title></head>
<body>
<h1>User Registration Form</h1>
<form action="process.jsp" method="post">
Username: <input type="text" name="username" required><br><br>
Password: <input type="password" name="password" required><br><br>
Name: <input type="text" name="name" required><br><br>
Credit Card Number: <input type="text" name="card" required><br><br>
Email: <input type="email" name="email" required><br><br>
Phone Number: <input type="text" name="phone" required><br><br>
<input type="submit" value="Register"><input type="reset" value="Clear">
</form>
</body>
</html>
